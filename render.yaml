# Cấu hình Render Blueprint cho Bóng X (site tĩnh, không cần build).
# Cách dùng: đẩy thư mục này lên GitHub → Render → New + → Blueprint → chọn repo.
services:
  - type: web
    name: bong-x-chat
    runtime: static
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /
        destination: /index.html
